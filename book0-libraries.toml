# Template config for book0_api, referenced via --config on the book0-api CLI.
#
# Paths are env-var placeholders (${VAR_NAME}), not real filesystem paths -
# this file is safe to commit as-is. Set the referenced env vars before
# starting the server; each is substituted in at load time. A tag whose
# placeholder references an unset env var makes the server fail to start
# (fail fast, rather than silently serving a broken library).
#
# Each value is a library's directory (the same syntax book0_cli's
# .book0.toml uses) - book0_api appends metadata.db itself, just like book0.
#
# Add one line per library you want to expose, then point book0-api at this
# file:
#   FICTION_LIBRARY_PATH=/path/to/fiction \
#   WORK_LIBRARY_PATH=/path/to/work \
#   uv run book0-api --config book0-libraries.toml --reload

[libraries]
fiction = "${FICTION_LIBRARY_PATH}"
work = "${WORK_LIBRARY_PATH}"
