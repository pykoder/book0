[project]
name = "book0"
version = "0.1.0"
description = "Calibre book lister"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "calibre-pg-sync",
    "epub2md",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
book0 = "book0_cli.main:main"
book0-remote = "book0_cli_remote.main:main"
book0-api = "book0_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/book0_core",
    "src/book0_presentation",
    "src/book0_config",
    "src/book0_cli",
    "src/book0_api",
    "src/book0_cli_remote",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
epub2md = { path = "../epub2md", editable = true }
calibre-pg-sync = { path = "../calibre_pg_sync", editable = true }

[dependency-groups]
dev = [
    "ebooklib>=0.20",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.mypy]
# epub2md et calibre_pg_sync (dépendances editables locales) ne publient pas
# de marqueur py.typed.
[[tool.mypy.overrides]]
module = "epub2md.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "calibre_pg_sync.*"
ignore_missing_imports = true
