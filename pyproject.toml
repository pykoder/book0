[project]
name = "book0"
version = "0.1.0"
description = "Calibre book lister"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
book0 = "book0_cli.main:main"
book0-remote = "book0_cli_remote.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/book0_core",
    "src/book0_presentation",
    "src/book0_cli",
    "src/book0_api",
    "src/book0_cli_remote",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
