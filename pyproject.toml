[project]
name = "book0"
version = "0.1.0"
description = "Calibre book lister"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "book0-core",
    "calibre-pg-sync",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
book0-api = "book0_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book0_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
calibre-pg-sync = { path = "../calibre_pg_sync", editable = true }
book0-core = { path = "../book0-core", editable = true }
book0-cli = { path = "../book0-cli", editable = true }

[dependency-groups]
dev = [
    "book0-cli",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.mypy]
# calibre_pg_sync (dépendance editable locale) ne publie pas de marqueur
# py.typed.
[[tool.mypy.overrides]]
module = "calibre_pg_sync.*"
ignore_missing_imports = true
