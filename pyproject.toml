[project]
name = "book0"
version = "0.1.0"
description = "Calibre book lister"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
book0 = "book0_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book0_core", "src/book0_presentation", "src/book0_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
